name: Translation Sync

# Weekly check that the *.ru.md translations still match their English sources.
# Drift is reported in the job summary and fails the run, since this repository
# has issues disabled.

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 9 * * 1'

jobs:
  check-translations:
    name: Check Translation Drift
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check translations
        run: |
          if python3 scripts/check_translations.py --markdown >> "$GITHUB_STEP_SUMMARY"; then
            echo "✅ All translations are up to date"
          else
            echo "::error::Russian translations are out of sync; see the job summary for the diffs"
            exit 1
          fi
